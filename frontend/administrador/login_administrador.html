<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/login_administrador.css">

    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;500&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="/frontend/favicoin.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/frontend/favicoin.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/frontend/favicoin.png">
</head>

<body>


        <div class="card">

            <h1 class="titulo">
                Panel de Administración
            </h1>

            <p class="subtitulo">
                Acceso exclusivo para gestionar los invitados
            </p>

            <p class="mensaje">
                Inicia sesión
            </p>

            <input type="email" id="email" placeholder="Correo electrónico" class="input-codigo" />

            <input type="password" id="password" placeholder="Contraseña" class="input-codigo" />

            <button id="btnLogin" class="btn">
                Ingresar
            </button>

            <p id="mensaje"></p>

        </div>
    <!-- JS -->
    <script src="js/login_administrador.js"></script>

</body>

</html>
