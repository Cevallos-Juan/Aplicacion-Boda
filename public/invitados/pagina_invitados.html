<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Invitación</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/invitados/css/pagina_invitados.css">

    <link rel="icon" type="image/png" href="/favicoin.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicoin.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicoin.png">
</head>

<body>
    <div id="intro">
        <div class="gold-particles">
            <div class="carousel-wrapper">
                <div class="carousel-track">

                    <div class="carousel-item">
                        <img src="/invitados/img/Nosotros_1.jpeg">
                    </div>

                    <div class="carousel-item center">
                        <img src="/invitados/img/Nosotros_3.jpeg">
                    </div>

                    <div class="carousel-item">
                        <img src="/invitados/img/Nosotros_2.jpeg">
                    </div>

                    <div class="carousel-item">
                        <img src="/invitados/img/Nosotros_4.jpeg">
                    </div>

                    <div class="carousel-item">
                        <img src="/invitados/img/Nosotros_5.jpeg">
                    </div>

                </div>
            </div>
        </div>

        <div class="overlay"></div>
        <!--CARTA-->
        <div class="intro-content">

            <p class="intro-small">
                Tenemos el honor de invitarte
            </p>

            <h1 class="intro-title">
                Juan David <span>&</span> Michelle
            </h1>

            <p class="intro-date">
                15 · Agosto · 2026
            </p>

            <p class="intro-message">
                Ha celebrar con nosotros este dia tan especial.
            </p>

            <div class="confirmacion-card">

                <h3>Confirmar asistencia</h3>

                <p>
                    Invitados permitidos:
                    <strong id="permitidos"></strong>
                </p>

                <input
                    type="number"
                    id="cantidad"
                    min="1"
                    placeholder="">

                <div id="botones">

                    <button onclick="confirmar(true)">
                        Asistiré
                    </button>

                    <button onclick="confirmar(false)">
                        No asistiré
                    </button>

                </div>

                <div id="motivo_container" style="display:none;">

                    <textarea
                        id="motivo"
                        placeholder="¿Deseas decirnos por qué no asistirás?">
                    </textarea>

                    <button onclick="enviarConfirmacion(false)">
                        Enviar respuesta
                    </button>

                </div>

                <p id="estado_confirmacion"></p>

            </div>

            <button
                id="btnAbrirInvitacion"
                class="btn-abrir"
                style="display:none"
                onclick="abrirInvitacion()">
                Abrir Invitación
            </button>

        </div>
    </div>

    <script src="/invitados/js/pagina_invitados.js"></script>
</body>

</html>
